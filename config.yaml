llm:
  provider: "deepseek"
  small_model: "deepseek-chat"
  large_model: "deepseek-reasoner"
  base_url: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 60
  pricing_per_1m:
    deepseek-chat: {input: 0.27, output: 1.10}
    deepseek-reasoner: {input: 0.55, output: 2.19}

cascade:
  enabled: true
  confidence_threshold: 0.7
  high_stakes_tiers: [VIP, PREMIUM]

cache:
  enabled: true
  max_entries: 512
  ttl_seconds: 3600

thresholds:
  perishable_delay_hours: 4.0
  premium_perishable_delay_hours: 2.0
  vip_exception_threshold: 3
  standard_exception_threshold: 5
  escalation_attempt_number: 3

api:
  host: "0.0.0.0"
  port: 8010
